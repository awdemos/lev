[project]
name = "lev"
version = "0.2.0"
description = "A Jev-inspired classifier that deliberates in while-loops instead of one-shot ifs."
requires-python = ">=3.10"

[project.scripts]
lev = "lev.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
